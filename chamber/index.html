<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Ravencraft · Gothic Chamber</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08080e;color:#e8d6c8;font:15px Georgia,serif}#ui{position:fixed;z-index:5;top:12px;left:12px;right:12px;background:#09070bbb;border:1px solid #6a4c42;border-radius:8px;padding:10px 14px;pointer-events:none}#info{font-size:13px;color:#bda69a}#tip{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:13px;background:#09070bd8;padding:8px 14px;border-radius:20px;white-space:nowrap;pointer-events:none}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="ui">RAVENCRAFT · Gothic Chamber<div id="info">Загрузка настоящих 3D-моделей и материалов…</div></div><div id="tip">Проведи пальцем, чтобы осмотреть комнату</div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#080a11');scene.fog=new THREE.FogExp2('#0b0b13',.015);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.06,100);camera.position.set(3.4,2.7,4.25);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.38;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-.3,1.45,-.6);controls.enableDamping=true;controls.minDistance=1.2;controls.maxDistance=6.2;controls.maxPolarAngle=Math.PI*.51;controls.update();
const ambient=new THREE.HemisphereLight(0x7687aa,0x51403b,2.05);scene.add(ambient);
const moon=new THREE.DirectionalLight(0xb9c7e8,2.1);moon.position.set(1,5,2);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);const fill=new THREE.DirectionalLight(0xffd6b0,1.4);fill.position.set(-4,4,3);scene.add(fill);const ceilingBounce=new THREE.PointLight(0xffd8b4,8,12,2);ceilingBounce.position.set(-1,4.6,0);scene.add(ceilingBounce);
const fire=new THREE.PointLight(0xff8e49,16,9,2);fire.position.set(4,1.6,-3.7);scene.add(fire);
const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness,side:THREE.DoubleSide});
const stone=mat(0x555058),timber=mat(0x38231f),floorMat=mat(0x312019),metal=mat(0x4c352c,.32),velvet=mat(0x37101b,1);
const tex=new THREE.TextureLoader();
const path='/Ravencraft/assets/pbr/';
const info=document.getElementById('info');
let loadedMaps=0,failedMaps=0,loadedModels=0,failedModels=0;
function status(){info.textContent='PBR: '+loadedMaps+'/9 · ошибок текстур: '+failedMaps+' · GLB: '+loadedModels+'/5 · ошибок GLB: '+failedModels}
function maps(material,name,rx,ry){
 for(const [type,property] of [['color','map'],['normal','normalMap'],['rough','roughnessMap']]){
  tex.load(path+name+'_'+type+'.jpg',t=>{
   t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
   if(type==='color'){t.colorSpace=THREE.SRGBColorSpace;material.color.set(0xffffff)}
   material[property]=t;if(type==='rough')material.roughness=1;material.needsUpdate=true;loadedMaps++;status()
  },undefined,()=>{failedMaps++;status()});
 }
}
maps(stone,'wall',3,2);maps(floorMat,'floor',3,3);maps(timber,'wood',3,2);
function box(w,h,d,x,y,z,m){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh}
function panel(w,h,x,y,z,rotation=0,m=stone){const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);mesh.position.set(x,y,z);mesh.rotation.y=rotation;mesh.receiveShadow=true;scene.add(mesh);return mesh}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,11),floorMat);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// Four closed walls. A window is an actual gap, not a glowing rectangle pasted over stone.
panel(12,5.5,0,2.75,-5.5);
panel(11,5.5,-6,2.75,0,Math.PI/2);
panel(6.1,5.5,6,2.75,-2.45,-Math.PI/2);panel(2.7,5.5,6,2.75,4.15,-Math.PI/2);panel(2.2,2.25,6,4.375,1.7,-Math.PI/2);
panel(3.6,5.5,-4.2,2.75,5.5,Math.PI);
panel(5.6,5.5,3.2,2.75,5.5,Math.PI);
panel(2.8,1.2,-.9,4.9,5.5,Math.PI);
panel(2.8,1.1,-.9,.55,5.5,Math.PI);
panel(.2,3.2,-2.2,2.7,5.5,Math.PI);panel(.2,3.2,.4,2.7,5.5,Math.PI);
const glass=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,metalness:.08,side:THREE.DoubleSide,emissive:0x443044,emissiveIntensity:.08});const windowPane=panel(2.6,3.2,-.9,2.7,5.48,Math.PI,glass);tex.load('/Ravencraft/assets/stained-glass.svg',t=>{t.colorSpace=THREE.SRGBColorSpace;glass.map=t;glass.color.set(0xffffff);glass.emissive=new THREE.Color(0x252030);glass.emissiveMap=t;glass.emissiveIntensity=.12;glass.needsUpdate=true},undefined,()=>{info.textContent+=' · витраж не загрузился'});
for(const x of [-2.2,.4])box(.11,3.4,.14,x,2.7,5.4,metal);
for(const y of [1.1,4.3])box(2.7,.1,.14,-.9,y,5.4,metal);
const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(12,11),timber);ceiling.rotation.x=Math.PI/2;ceiling.position.y=5.5;scene.add(ceiling);
for(const x of [-5.6,-2.8,0,2.8,5.6])box(.24,.28,11,x,5.34,0,timber);
for(const z of [-5.1,0,5.1])box(12,.22,.24,0,5.32,z,timber);
const carpet=new THREE.Mesh(new THREE.PlaneGeometry(6.6,4.7),velvet);carpet.rotation.x=-Math.PI/2;carpet.position.set(-1,.025,.8);carpet.receiveShadow=true;scene.add(carpet);
const gold=mat(0x866342,.36);
for(const z of [-1.52,3.12])box(6.65,.018,.05,-1,.034,z,gold);
for(const x of [-4.3,2.3])box(.05,.018,4.65,x,.034,.8,gold);
// Fireplace: PBR stone surround and animated transparent flame shader. This is not a downloaded GLB fireplace.
const hearth=mat(0x171216);const darkStone=mat(0x343037);
const fx=3.7,fz=-5.20;
box(3.15,.28,.75,fx,.17,fz+.28,stone);
box(.5,2.75,.62,fx-1.28,1.57,fz+.27,stone);
box(.5,2.75,.62,fx+1.28,1.57,fz+.27,stone);
box(3.3,.28,.87,fx,3.02,fz+.28,stone);box(3.48,.14,.94,fx,3.23,fz+.3,stone);
box(2.42,2.55,.10,fx,1.53,fz-.08,hearth);
const grate=box(2.15,.07,.16,fx,.23,fz+.63,metal);
for(let i=0;i<9;i++)box(.025,.18,.035,fx-1.0+i*.25,.35,fz+.75,metal);
const fireShader=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uTime:{value:0}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:`precision mediump float;uniform float uTime;varying vec2 vUv;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+1.),f.x),f.y);}void main(){vec2 p=vUv;float n=noise(vec2(p.x*5.+uTime*.55,p.y*4.-uTime*2.2));float n2=noise(vec2(p.x*11.-uTime*.7,p.y*9.-uTime*3.));float height=.25+.55*(1.-abs(p.x-.5)*1.5)+.19*n;float shape=smoothstep(.0,.12,p.y)*(1.-smoothstep(height-.22,height,p.y));float tongues=smoothstep(.44,.9,n*.7+n2*.4);float alpha=shape*(.55+.45*tongues)*smoothstep(.0,.16,p.x)*smoothstep(1.,.84,p.x);vec3 col=mix(vec3(1.,.17,.018),vec3(1.,.75,.17),clamp(p.y*.9+n2*.5,0.,1.));col=mix(col,vec3(1.,.95,.65),smoothstep(.0,.3,p.y)*(.5+n2*.5));gl_FragColor=vec4(col,alpha*.9);}`});
for(let i=0;i<3;i++){const flame=new THREE.Mesh(new THREE.PlaneGeometry(1.55+i*.17,1.65+i*.1),fireShader);flame.position.set(fx+(i-1)*.13,1.05,fz+.73+i*.055);flame.renderOrder=3;scene.add(flame)}
for(let i=0;i<4;i++){const log=box(1.35,.13,.15,fx+(i-1.5)*.06,.36+i*.065,fz+.62,mat(0x2d1710));log.rotation.z=(i%2?.17:-.15)}
fire.position.set(fx,1.5,fz+1.1);const fireGlow=new THREE.PointLight(0xffa45b,11,5,2);fireGlow.position.set(fx,1.2,fz+1.3);scene.add(fireGlow);
const base='https://raw.githubusercontent.com/nalabogarne-create/Ravencraft/imvu-quality-rebuild/assets/real/';
const items=[
 ['gothic-bed.glb',-2.3,-.4,2.65,0,0],
 ['chandelier.glb',0,-.1,1.15,4.1,0],
 ['castle-door.glb',5.87,1.7,3.25,0,Math.PI/2],
 ['clock.glb',-5.2,-3.8,2.05,0,Math.PI/2],
 ['candlestick.glb',-4.5,-2.2,1.15,0,0]
];
const loader=new GLTFLoader();
for(const [file,x,z,height,lift,rotation] of items){
 loader.load(base+file,gltf=>{
  const root=gltf.scene;const bounds=new THREE.Box3().setFromObject(root);const size=bounds.getSize(new THREE.Vector3());if(size.y<=0){failedModels++;status();return;}
  root.scale.setScalar(height/size.y);root.updateMatrixWorld(true);
  const scaled=new THREE.Box3().setFromObject(root);const center=scaled.getCenter(new THREE.Vector3());
  root.position.set(x-center.x,lift-scaled.min.y,z-center.z);root.rotation.y=rotation;
  root.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});
  scene.add(root);loadedModels++;status();
 },undefined,()=>{failedModels++;status()});
}
// Close the rectangular gaps around the arched imported door with matching stone reveals.
const archStone=stone;
box(.22,3.3,.55,6.02,1.65,.38,archStone);
box(.22,3.3,.55,6.02,1.65,3.02,archStone);
box(.22,.55,3.15,6.02,3.45,1.7,archStone);
// Carved depth for stained glass: stone sill, timber frame and mullions.
box(2.95,.19,.42,-.9,1.02,5.32,stone);
box(.18,3.55,.3,-2.3,2.73,5.32,timber);
box(.18,3.55,.3,.5,2.73,5.32,timber);
box(2.9,.17,.3,-.9,4.5,5.32,timber);
// Keep the window luminous from behind, but avoid a fake bright point reflection on its face.
const windowBacklight=new THREE.PointLight(0x8e739d,1.5,3,2);windowBacklight.position.set(-.9,2.7,5.05);scene.add(windowBacklight);
status();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const animationClock=new THREE.Clock();function tick(){requestAnimationFrame(tick);fireShader.uniforms.uTime.value=animationClock.getElapsedTime();fire.intensity=13+Math.sin(animationClock.elapsedTime*9)*2.5+Math.sin(animationClock.elapsedTime*17)*1.4;controls.update();renderer.render(scene,camera)}tick();
</script></body></html>
