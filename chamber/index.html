<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Ravencraft · Gothic Chamber</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08080e;color:#e8d6c8;font:15px Georgia,serif}#ui{position:fixed;z-index:5;top:12px;left:12px;right:12px;background:#09070bbb;border:1px solid #6a4c42;border-radius:8px;padding:10px 14px;pointer-events:none}#info{font-size:13px;color:#bda69a}#tip{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);font-size:13px;background:#09070bd8;padding:8px 14px;border-radius:20px;white-space:nowrap;pointer-events:none}canvas{display:block}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="ui">RAVENCRAFT · Gothic Chamber<div id="info">Загрузка настоящих 3D-моделей и материалов…</div><div id="fireStatus" style="font-size:12px;color:#d8b69d">Камин: загрузка модели…</div></div><div id="tip">Проведи пальцем, чтобы осмотреть комнату</div><script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#080a11');scene.fog=new THREE.FogExp2('#0b0b13',.015);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.06,100);camera.position.set(3.6,2.8,5.7);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.38;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.append(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-.6,1.6,-.5);controls.enableDamping=true;controls.minDistance=1.2;controls.maxDistance=6.2;controls.maxPolarAngle=Math.PI*.51;controls.update();
const ambient=new THREE.HemisphereLight(0x7687aa,0x51403b,2.05);scene.add(ambient);
const moon=new THREE.DirectionalLight(0xb9c7e8,2.1);moon.position.set(1,5,2);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);const fill=new THREE.DirectionalLight(0xffd6b0,1.4);fill.position.set(-4,4,3);scene.add(fill);const ceilingBounce=new THREE.PointLight(0xffd8b4,8,12,2);ceilingBounce.position.set(-1,4.6,0);scene.add(ceilingBounce);

const mat=(color,roughness=.8)=>new THREE.MeshStandardMaterial({color,roughness,side:THREE.DoubleSide});
const stone=mat(0x555058),timber=mat(0x38231f),floorMat=mat(0x312019),metal=mat(0x4c352c,.32),velvet=mat(0x37101b,1);
const tex=new THREE.TextureLoader();
const path='/Ravencraft/assets/pbr/';
const info=document.getElementById('info');
let loadedMaps=0,failedMaps=0,loadedModels=0,failedModels=0;
function status(){info.textContent='PBR: '+loadedMaps+'/9 · ошибок текстур: '+failedMaps+' · GLB: '+loadedModels+'/5 · ошибок GLB: '+failedModels}
function maps(material,name,rx,ry){
 for(const [type,property] of [['color','map'],['normal','normalMap'],['rough','roughnessMap']]){
  tex.load(path+name+'_'+type+'.jpg',t=>{
   t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
   if(type==='color'){t.colorSpace=THREE.SRGBColorSpace;material.color.set(0xffffff)}
   material[property]=t;if(type==='rough')material.roughness=1;material.needsUpdate=true;loadedMaps++;status()
  },undefined,()=>{failedMaps++;status()});
 }
}
maps(stone,'wall',3,2);maps(floorMat,'floor',3,3);maps(timber,'wood',3,2);
function box(w,h,d,x,y,z,m){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh}
function panel(w,h,x,y,z,rotation=0,m=stone){const mesh=new THREE.Mesh(new THREE.PlaneGeometry(w,h),m);mesh.position.set(x,y,z);mesh.rotation.y=rotation;mesh.receiveShadow=true;scene.add(mesh);return mesh}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(12,11),floorMat);floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// Four closed walls. A window is an actual gap, not a glowing rectangle pasted over stone.
panel(12,5.5,0,2.75,-5.5);
panel(11,5.5,-6,2.75,0,Math.PI/2);
panel(6.1,5.5,6,2.75,-2.45,-Math.PI/2);panel(2.7,5.5,6,2.75,4.15,-Math.PI/2);panel(2.2,2.25,6,4.375,1.7,-Math.PI/2);
panel(3.6,5.5,-4.2,2.75,5.5,Math.PI);
panel(5.6,5.5,3.2,2.75,5.5,Math.PI);
panel(2.8,1.2,-.9,4.9,5.5,Math.PI);
panel(2.8,1.1,-.9,.55,5.5,Math.PI);
panel(.2,3.2,-2.2,2.7,5.5,Math.PI);panel(.2,3.2,.4,2.7,5.5,Math.PI);
const glass=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3,metalness:.08,side:THREE.DoubleSide,emissive:0x443044,emissiveIntensity:.08});const windowPane=panel(2.6,3.2,-.9,2.7,5.48,Math.PI,glass);tex.load('/Ravencraft/assets/stained-glass.svg',t=>{t.colorSpace=THREE.SRGBColorSpace;glass.map=t;glass.color.set(0xffffff);glass.emissive=new THREE.Color(0x252030);glass.emissiveMap=t;glass.emissiveIntensity=.12;glass.needsUpdate=true},undefined,()=>{info.textContent+=' · витраж не загрузился'});
for(const x of [-2.2,.4])box(.11,3.4,.14,x,2.7,5.4,metal);
for(const y of [1.1,4.3])box(2.7,.1,.14,-.9,y,5.4,metal);
const ceiling=new THREE.Mesh(new THREE.PlaneGeometry(12,11),timber);ceiling.rotation.x=Math.PI/2;ceiling.position.y=5.5;scene.add(ceiling);
for(const x of [-5.6,-2.8,0,2.8,5.6])box(.24,.28,11,x,5.34,0,timber);
for(const z of [-5.1,0,5.1])box(12,.22,.24,0,5.32,z,timber);
const carpet=new THREE.Mesh(new THREE.PlaneGeometry(6.6,4.7),velvet);carpet.rotation.x=-Math.PI/2;carpet.position.set(-1,.025,.8);carpet.receiveShadow=true;scene.add(carpet);
const gold=mat(0x866342,.36);
for(const z of [-1.52,3.12])box(6.65,.018,.05,-1,.034,z,gold);
for(const x of [-4.3,2.3])box(.05,.018,4.65,x,.034,.8,gold);
// Real downloadable CC0 fireplace mesh (not the previous geometric placeholder).
const fx=3.7,fz=-5.22;
const fire=new THREE.PointLight(0xff8e49,10,7,2);fire.position.set(fx,1.15,fz+1.1);scene.add(fire);
const fireShader=new THREE.ShaderMaterial({transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uTime:{value:0}},vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform float uTime;varying vec2 vUv;void main(){float n=sin(vUv.x*17.+uTime*4.)*.12+sin(vUv.x*31.-uTime*7.)*.07;float h=.78-abs(vUv.x-.5)*.9+n;float a=smoothstep(.02,.18,vUv.y)*(1.-smoothstep(h-.25,h,vUv.y));vec3 c=mix(vec3(1.,.2,.02),vec3(1.,.8,.22),vUv.y);gl_FragColor=vec4(c,a*.8);}' });
const fireplaceLoader=new GLTFLoader();
const fireplaceURL='https://tevy.dev/models/great-hall-fireplace/v1/lod0.glb';
fireplaceLoader.load(fireplaceURL,gltf=>{
 const obj=gltf.scene;obj.updateMatrixWorld(true);const bb=new THREE.Box3().setFromObject(obj),dim=bb.getSize(new THREE.Vector3());
 if(!Number.isFinite(dim.y)||dim.y<=0)throw Error('Некорректная модель камина');
 const scale=3.9/dim.y;obj.scale.setScalar(scale);obj.updateMatrixWorld(true);
 const fitted=new THREE.Box3().setFromObject(obj),center=fitted.getCenter(new THREE.Vector3());
 obj.position.set(fx-center.x, -fitted.min.y, fz+.12-center.z);
 obj.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});scene.add(obj);
 document.getElementById('fireStatus').textContent='Камин: настоящая 3D-модель загружена';
},undefined,e=>{console.warn('Fireplace GLB',e);document.getElementById('fireStatus').textContent='Камин: ошибка загрузки 3D-модели';});
for(let i=0;i<3;i++){const flame=new THREE.Mesh(new THREE.PlaneGeometry(.8+i*.16,1.2),fireShader);flame.position.set(fx+(i-1)*.23,.72,fz+1.12+i*.03);scene.add(flame)}
const base='https://raw.githubusercontent.com/nalabogarne-create/Ravencraft/imvu-quality-rebuild/assets/real/';
const items=[
 ['gothic-bed.glb',-2.3,-.4,2.65,0,0],
 ['chandelier.glb',0,-.1,1.15,4.1,0],
 ['castle-door.glb',5.87,1.7,3.25,0,Math.PI/2],
 ['clock.glb',-5.2,-3.8,2.05,0,Math.PI/2],
 ['candlestick.glb',-4.5,-2.2,1.15,0,0]
];
const loader=new GLTFLoader();
for(const [file,x,z,height,lift,rotation] of items){
 loader.load(base+file,gltf=>{
  const root=gltf.scene;const bounds=new THREE.Box3().setFromObject(root);const size=bounds.getSize(new THREE.Vector3());if(size.y<=0){failedModels++;status();return;}
  root.scale.setScalar(height/size.y);root.updateMatrixWorld(true);
  const scaled=new THREE.Box3().setFromObject(root);const center=scaled.getCenter(new THREE.Vector3());
  root.position.set(x-center.x,lift-scaled.min.y,z-center.z);root.rotation.y=rotation;
  root.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});
  scene.add(root);loadedModels++;status();
 },undefined,()=>{failedModels++;status()});
}
// Close the rectangular gaps around the arched imported door with matching stone reveals.
const archStone=stone;
box(.22,3.3,.55,6.02,1.65,.38,archStone);
box(.22,3.3,.55,6.02,1.65,3.02,archStone);
box(.22,.55,3.15,6.02,3.45,1.7,archStone);
// Carved depth for stained glass: stone sill, timber frame and mullions.
box(2.95,.19,.42,-.9,1.02,5.32,stone);
box(.18,3.55,.3,-2.3,2.73,5.32,timber);
box(.18,3.55,.3,.5,2.73,5.32,timber);
box(2.9,.17,.3,-.9,4.5,5.32,timber);
// Keep the window luminous from behind, but avoid a fake bright point reflection on its face.
const windowBacklight=new THREE.PointLight(0x8e739d,1.5,3,2);windowBacklight.position.set(-.9,2.7,5.05);scene.add(windowBacklight);
function person(isLia,x,z){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);
 const dress=mat(isLia?0x271321:0x17141d,.88),trim=mat(0x9c7854,.42,.5);
 const face=mat(isLia?0xe9c6b8:0xd6b3a7,.91),locks=mat(isLia?0xe8d8b7:0x161018,.82);
 const lips=mat(0x8e4b55,.72),eyes=mat(isLia?0x839bb2:0x454754,.22);
 const make=(geo,m,parent,px,py,pz)=>{const o=new THREE.Mesh(geo,m);o.position.set(px,py,pz);o.castShadow=true;parent.add(o);return o};
 const ball=(parent,px,py,pz,rx,ry,rz,m)=>{const o=make(new THREE.SphereGeometry(1,20,14),m,parent,px,py,pz);o.scale.set(rx,ry,rz);return o};
 const chest=ball(g,0,1.62,0,isLia?.29:.37,.59,isLia?.22:.27,dress);
 const waist=ball(g,0,1.12,0,isLia?.23:.31,.25,.2,dress);
 if(isLia){
  const skirt=make(new THREE.CylinderGeometry(.23,.76,1.27,26,6),dress,g,0,.65,0);
  for(let k=0;k<12;k++){let a=k*Math.PI/6;const seam=make(new THREE.CylinderGeometry(.012,.024,1.12,5),trim,g,Math.sin(a)*.53,.6,Math.cos(a)*.53);seam.rotation.z=Math.sin(a)*.25;seam.rotation.x=Math.cos(a)*.25}
  ball(g,0,1.74,-.23,.16,.18,.055,trim);
 }else{
  const coat=make(new THREE.CylinderGeometry(.32,.52,1.42,16),dress,g,0,.86,0);
  ball(g,0,1.88,-.21,.16,.36,.06,mat(0x3e3039));
  const collar=make(new THREE.CylinderGeometry(.28,.36,.23,16),dress,g,0,2.09,0);
  for(let q of [-1,1]){const lapel=ball(g,q*.19,1.66,-.27,.12,.44,.06,trim);lapel.rotation.z=q*.33}
 }
 const neck=make(new THREE.CylinderGeometry(.12,.13,.26,12),face,g,0,2.11,0);
 const head=ball(g,0,2.44,0,.255,.35,.235,face);
 // Front is -Z, so faces are visible when looking at the avatar from the front.
 ball(g,-.105,2.46,-.221,.055,.028,.013,eyes);ball(g,.105,2.46,-.221,.055,.028,.013,eyes);
 ball(g,-.105,2.467,-.233,.016,.018,.01,mat(0x111017));ball(g,.105,2.467,-.233,.016,.018,.01,mat(0x111017));
 ball(g,0,2.36,-.245,.043,.075,.052,face);ball(g,0,2.275,-.228,.085,.021,.016,lips);
 ball(g,0,2.68,.02,.28,.16,.26,locks);
 if(isLia){
  for(let i=0;i<18;i++){const a=i/18*Math.PI*2;const px=Math.sin(a)*.245,pz=Math.cos(a)*.205+.055;
   if(pz<-.09&&Math.abs(px)<.16)continue;
   const strand=ball(g,px,1.69,pz,.045,.93,.055,locks);strand.rotation.z=-px*.15;
  }
  ball(g,-.2,2.62,-.05,.12,.13,.18,locks);ball(g,.2,2.62,-.05,.12,.13,.18,locks);
 }else{
  for(let i=0;i<16;i++){const a=i/16*Math.PI*2;const px=Math.sin(a)*.24,pz=Math.cos(a)*.2+.07;
   const strand=ball(g,px,2.32,pz,.075,.45,.09,locks);strand.rotation.z=-px*.6;
  }
 }
 const arms=[],legs=[];
 for(let side of [-1,1]){
  const shoulder=new THREE.Group();shoulder.position.set(side*(isLia?.32:.41),1.93,0);g.add(shoulder);
  ball(shoulder,0,-.24,0,.115,.29,.115,dress);
  const elbow=new THREE.Group();elbow.position.set(0,-.49,0);shoulder.add(elbow);
  ball(elbow,0,-.21,0,.10,.27,.105,dress);
  ball(elbow,0,-.46,0,.082,.105,.082,face);
  shoulder.userData.elbow=elbow;arms.push(shoulder);
  const hip=new THREE.Group();hip.position.set(side*.18,.93,0);g.add(hip);
  ball(hip,0,-.33,0,.145,.46,.15,isLia?mat(0x1b1820):dress);
  ball(hip,0,-.78,-.11,.17,.13,.29,mat(0x111017));legs.push(hip);
 }
 return {g,arms,legs};
}


const lia=person(true,-1.25,1.5),aurel=person(false,.4,1.45);
lia.g.rotation.y=-.4;aurel.g.rotation.y=.45;
status();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const animationClock=new THREE.Clock();function tick(){requestAnimationFrame(tick);fireShader.uniforms.uTime.value=animationClock.getElapsedTime();fire.intensity=9+Math.sin(animationClock.elapsedTime*9)*1.5;controls.update();renderer.render(scene,camera)}tick();
</script></body></html>
