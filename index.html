<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Ravencraft · Gothic Chamber</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080810;color:#e8d9c4;font:14px Georgia,serif;touch-action:none}canvas{display:block}#top{position:fixed;top:10px;left:12px;text-shadow:0 2px 8px #000;pointer-events:none}#top b{font-size:19px;letter-spacing:2px}#tip{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#100f19cc;padding:9px 16px;border:1px solid #9e835a;border-radius:20px;white-space:nowrap;pointer-events:none}#joy{position:fixed;bottom:38px;left:28px;width:108px;height:108px;border-radius:50%;border:2px solid #c5b3a46b;background:#ffffff10;touch-action:none}#nub{position:absolute;left:35px;top:35px;width:38px;height:38px;border-radius:50%;background:#c4a98288}#hug{position:fixed;bottom:48px;right:26px;border-radius:50%;width:78px;height:78px;border:2px solid #b9956c;background:#281724d9;color:#fff;font:15px Georgia}#status{position:fixed;top:12px;right:12px;color:#e7c8a0;font:12px sans-serif}#err{position:fixed;top:65px;left:12px;color:#ffc3a5}</style></head><body><div id="top"><b>RAVENCRAFT</b><div>Готическая спальня · Web Edition</div></div><div id="status">Загрузка…</div><div id="err"></div><div id="joy"><div id="nub"></div></div><button id="hug">Обнять</button><div id="tip">Левый круг — идти · проведи справа — осмотреться</div><script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x10121c);scene.fog=new T.FogExp2(0x10121c,.024);

const mat=(c,r=1,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});const stone=mat(0x55545d),dark=mat(0x2a2731),wood=mat(0x3c241d),gold=mat(0x9e7743,.43,.55),red=mat(0x401b30),linen=mat(0xa19a9a),skin=mat(0xd7b4a1),black=mat(0x111118),hair=mat(0xe8d3a6),flame=new T.MeshBasicMaterial({color:0xffb54c});

function surfaceTexture(kind){

 const ctx=c.getContext('2d');ctx.fillStyle=kind==='stone'?'#55505a':'#38231e';ctx.fillRect(0,0,512,512);
 let seed=kind==='stone'?971:557;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
 if(kind==='stone'){
  for(let y=0;y<512;y+=52){for(let x=-70;x<512;x+=102){const xx=x+((y/52)%2)*51,v=Math.floor(66+rnd()*38);ctx.fillStyle='rgb('+v+','+(v-3)+','+(v+1)+')';ctx.fillRect(xx+2,y+2,98,48);ctx.strokeStyle='#26252c';ctx.strokeRect(xx+2,y+2,98,48);for(let i=0;i<34;i++){ctx.fillStyle='rgba(18,15,20,'+(rnd()*.16)+')';ctx.fillRect(xx+5+rnd()*90,y+4+rnd()*43,1+rnd()*5,1+rnd()*3)}}}

}
stone.map=surfaceTexture('stone');stone.roughness=.97;stone.needsUpdate=true;

function box(w,h,d,x,y,z,m,shadow=true){let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
function sphere(r,x,y,z,m){let o=new T.Mesh(new T.SphereGeometry(r,12,10),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}

box(28,.3,24,0,-.16,0,dark);box(28,9,.7,0,4.5,-12,stone);box(28,9,.7,0,4.5,12,stone);box(.7,9,24,-14,4.5,0,stone);box(.7,9,24,14,4.5,0,stone);
for(let x=-13;x<=13;x+=2){box(.12,9,.14,x,4.5,-11.59,dark);box(.12,9,.14,x,4.5,11.59,dark)}for(let z=-11;z<=11;z+=2){box(.14,9,.12,-13.59,4.5,z,dark);box(.14,9,.12,13.59,4.5,z,dark)}
for(let y=1;y<9;y+=1.1){box(28,.08,.12,0,y,-11.59,dark);box(28,.08,.12,0,y,11.59,dark)}
for(let x of [-10,0,10]){for(let z of [-8,8]){box(.85,8,.85,x,4,z,stone);box(1.15,.3,1.15,x,7.9,z,gold);box(1.2,.35,1.2,x,.7,z,gold)}}
box(29,.5,25,0,9,0,dark);for(let x=-12;x<=12;x+=6)box(.32,.45,24,x,8.6,0,wood);
for(let x of [-7,7]){box(3.4,5,.18,x,4,-11.14,black);box(.13,5,.2,x,4,-10.99,gold);box(3.4,.15,.2,x,4,-10.99,gold);for(let k=0;k<5;k++)box(.12,5,.2,x-1.5+k*.75,4,-10.96,gold)}
// Bed with carved canopy and hanging curtains
box(5.2,.7,7.1,-6,.75,-4,wood);box(4.8,.4,6.6,-6,1.2,-4,linen);box(5,.4,.7,-6,1.55,-7.1,red);
for(let x of [-8.6,-3.4])for(let z of [-7.65,-.35]){cylinder(.18,.24,6.2,x,3.1,z,wood);sphere(.28,x,6.35,z,gold)}
box(5.5,.35,7.7,-6,6.2,-4,wood);for(let z of [-7.65,-.35])box(5.5,.8,.25,-6,5.75,z,red);for(let x of [-8.6,-3.4])box(.25,1.2,7.7,x,5.55,-4,red);
for(let x of [-8.5,-3.5]){let c=box(.13,4.1,2.6,x,3.95,-6.2,red);c.material=mat(0x592b46,.9)}
// fireplace
box(5,5,.8,6,2.5,-11.1,wood);box(3.1,3.2,.25,6,1.6,-10.58,black);box(5.7,.35,1.25,6,4.9,-10.6,gold);for(let x of [4.25,7.75])cylinder(.35,.4,4.4,x,2.5,-10.5,stone);
for(let i=0;i<8;i++){let x=5.15+(i%4)*.56;let z=-10.38+Math.floor(i/4)*.45;sphere(.22+Math.random()*.22,x,.55+Math.random()*.3,z,flame)}
let fire=new T.PointLight(0xff8236,100,16,2);fire.position.set(6,2,-9.5);fire.castShadow=true;fire.shadow.mapSize.set(512,512);scene.add(fire);
for(let x of [-10,-1,10])for(let z of [-9,6]){cylinder(.16,.16,1.2,x,1,z,gold);sphere(.19,x,1.73,z,flame);let l=new T.PointLight(0xffb873,9,7,2);l.position.set(x,1.8,z);scene.add(l)}
const moon=new T.DirectionalLight(0x8eabf8,2);moon.position.set(-8,13,4);moon.castShadow=true;moon.shadow.mapSize.set(1024,1024);scene.add(moon);scene.add(new T.AmbientLight(0x9091ae,.6));
function person(isLia,x,z){const g=new T.Group();scene.add(g);g.position.set(x,0,z);const cloth=isLia?red:black;const body=new T.Mesh(new T.CylinderGeometry(.32,.45,1.45,12),cloth);body.position.y=1.32;g.add(body);const head=new T.Mesh(new T.SphereGeometry(.29,16,12),skin);head.position.y=2.31;g.add(head);const scalp=new T.Mesh(new T.SphereGeometry(.302,16,12),isLia?hair:black);scalp.scale.set(1,.52,1);scalp.position.y=2.49;g.add(scalp);if(isLia){for(let k=0;k<13;k++){const a=k/13*Math.PI*2;const strand=new T.Mesh(new T.CylinderGeometry(.065,.055,1.7,6),hair);strand.position.set(Math.sin(a)*.25,1.66,Math.cos(a)*.23);g.add(strand)}}const arms=[];for(let s of [-1,1]){const arm=new T.Group();arm.position.set(s*.39,1.91,0);const limb=new T.Mesh(new T.CylinderGeometry(.105,.09,1.0,9),cloth);limb.position.y=-.47;arm.add(limb);g.add(arm);arms.push(arm);const leg=new T.Mesh(new T.CylinderGeometry(.13,.13,.7,9),black);leg.position.set(s*.18,.36,0);g.add(leg)}return {g,arms}}const lia=person(true,0,4),aurel=person(false,3,-2);let yaw=0,pitch=.32,zoom=6.5,joyX=0,joyY=0,hugUntil=0;const keys={};
document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const joy=document.getElementById('joy'),nub=document.getElementById('nub');function moveJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;const q=Math.min(1,48/Math.max(1,Math.hypot(dx,dy)));joyX=dx*q/48;joyY=-dy*q/48;nub.style.transform='translate('+joyX*38+'px,'+-joyY*38+'px)'}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))moveJoy(e)});function release(){joyX=joyY=0;nub.style.transform=''}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
let lastX=0,lastY=0,drag=false;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-lastX)*.005;pitch=Math.max(.05,Math.min(.9,pitch+(e.clientY-lastY)*.003));lastX=e.clientX;lastY=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=false);
document.getElementById('hug').onclick=()=>{if(lia.g.position.distanceTo(aurel.g.position)<2.6){hugUntil=performance.now()+3500;document.getElementById('tip').textContent='Аурель обнимает Лию ♥'}else document.getElementById('tip').textContent='Подойди ближе к Аурелю ♥'};
const clock=new T.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),f=joyY+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=joyX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);const mag=Math.max(1,Math.hypot(f,s));let dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*dt*3/mag,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*dt*3/mag;lia.g.position.x=Math.max(-12,Math.min(12,lia.g.position.x+dx));lia.g.position.z=Math.max(-10,Math.min(10,lia.g.position.z+dz));if(Math.abs(dx)+Math.abs(dz)>.002)lia.g.rotation.y=Math.atan2(dx,dz);const h=performance.now()<hugUntil;if(h){lia.g.position.lerp(aurel.g.position.clone().add(new T.Vector3(0,0,1.1)),.05);lia.g.rotation.y=Math.PI;aurel.g.rotation.y=0}for(const p of [lia,aurel]){p.arms[0].rotation.z=T.MathUtils.lerp(p.arms[0].rotation.z,h?-.8:0,.07);p.arms[1].rotation.z=T.MathUtils.lerp(p.arms[1].rotation.z,h?.8:0,.07)}camera.position.lerp(new T.Vector3(lia.g.position.x+Math.sin(yaw)*zoom,lia.g.position.y+2.3+Math.sin(pitch)*3,lia.g.position.z+Math.cos(yaw)*zoom),.14);camera.lookAt(lia.g.position.x,1.45,lia.g.position.z);fire.intensity=95+Math.sin(performance.now()*.013)*12;renderer.render(scene,camera)}loop();document.getElementById('status').textContent='Веб-версия · текстуры';window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
