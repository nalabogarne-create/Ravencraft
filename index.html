const clock=new T.Clock();let walkPhase=0;function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),f=joyY+(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=joyX+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);const mag=Math.max(1,Math.hypot(f,s));let dx=(-Math.sin(yaw)*f+Math.cos(yaw)*s)*dt*3/mag,dz=(-Math.cos(yaw)*f-Math.sin(yaw)*s)*dt*3/mag;lia.g.position.x=Math.max(-12,Math.min(12,lia.g.position.x+dx));lia.g.position.z=Math.max(-10,Math.min(10,lia.g.position.z+dz));if(Math.abs(dx)+Math.abs(dz)>.002)lia.g.rotation.y=Math.atan2(dx,dz);const h=performance.now()<hugUntil;const moving=Math.abs(dx)+Math.abs(dz)>.002;if(moving&&!h)walkPhase+=dt*10;for(const leg of lia.legs){leg.rotation.x=T.MathUtils.lerp(leg.rotation.x,moving&&!h?Math.sin(walkPhase+(leg===lia.legs[0]?0:Math.PI))*.37:0,.16)}if(h){lia.g.position.lerp(aurel.g.position.clone().add(new T.Vector3(0,0,1.1)),.05);lia.g.rotation.y=Math.PI;aurel.g.rotation.y=0}for(const p of [lia,aurel]){p.arms[0].rotation.z=T.MathUtils.lerp(p.arms[0].rotation.z,h?-.95:0,.09);p.arms[1].rotation.z=T.MathUtils.lerp(p.arms[1].rotation.z,h?.95:0,.09)}camera.position.lerp(new T.Vector3(lia.g.position.x+Math.sin(yaw)*zoom,lia.g.position.y+2.3+Math.sin(pitch)*3,lia.g.position.z+Math.cos(yaw)*zoom),.14);camera.lookAt(lia.g.position.x,1.45,lia.g.position.z);fire.intensity=95+Math.sin(performance.now()*.013)*12;chamberAnimate(performance.now());renderer.render(scene,camera)}loop();document.getElementById('status').textContent='Спальня · новая отделка';window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
