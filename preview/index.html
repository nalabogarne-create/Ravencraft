<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Ravencraft — готическая спальня v3</title><style>html,body{margin:0;height:100%;background:#100e16;color:#f5e7d6;font:14px Georgia}#status{position:fixed;top:12px;left:12px;right:12px;background:#100e16d9;padding:12px;border:1px solid #71594d;border-radius:8px;z-index:2}canvas{display:block}button{position:fixed;bottom:24px;right:18px;padding:13px 18px;background:#37212e;color:#fff;border:1px solid #ae7d63;border-radius:30px;z-index:2}</style></head><body><div id="status">Новая спальня: загрузка сцены…</div><button id="turn">Повернуть камеру</button><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const status=document.querySelector('#status'),scene=new THREE.Scene();scene.background=new THREE.Color(0x17141d);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,150);camera.position.set(6,4,8);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.6;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.25,0);orbit.enableDamping=true;orbit.maxPolarAngle=Math.PI*.49;orbit.update();
scene.add(new THREE.HemisphereLight(0x9db2d7,0xffb775,2.1));
const lamp=new THREE.DirectionalLight(0xffc6a1,3);lamp.position.set(3,8,5);lamp.castShadow=true;scene.add(lamp);
const fill=new THREE.PointLight(0xf5a56d,75,18);fill.position.set(-3,3,-2);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(18,18),new THREE.MeshStandardMaterial({color:0x302329,roughness:.72}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
// Architectural shell only; furniture stays imported as genuine GLB assets.
const room=new THREE.Group();scene.add(room);
function wall(w,h,x,y,z,material,rot=0){const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),material);m.position.set(x,y,z);m.rotation.y=rot;m.receiveShadow=true;room.add(m);return m}
const stone=new THREE.MeshStandardMaterial({color:0x55515a,roughness:.94,side:THREE.DoubleSide});
const wood=new THREE.MeshStandardMaterial({color:0x382320,roughness:.7,metalness:.05});
const velvet=new THREE.MeshStandardMaterial({color:0x491923,roughness:1,side:THREE.DoubleSide});
const moonGlass=new THREE.MeshStandardMaterial({color:0x8596b2,emissive:0x35415c,emissiveIntensity:.38,roughness:.18,metalness:.18,side:THREE.DoubleSide});
const brass=new THREE.MeshStandardMaterial({color:0x9c7653,metalness:.7,roughness:.38});
wall(14,6,0,3,-5,stone);wall(11,6,-7,3,.5,stone,Math.PI/2);wall(11,6,7,3,.5,stone,-Math.PI/2);
function beam(w,h,d,x,y,z,mat=wood){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;room.add(m);return m}
for(const x of [-6.6,-3.3,0,3.3,6.6])beam(.18,6,.25,x,3,-4.8);
for(const y of [.45,2.85,5.65])beam(14,.16,.22,0,y,-4.78);
for(const z of [-4.8,-1.4,1.9,5.5])beam(.17,.2,11,-6.85,5.72,z);
const window=wall(2.45,3.65,3.65,3.35,-4.69,moonGlass);
beam(.13,3.65,.16,2.45,3.35,-4.52,brass);beam(.13,3.65,.16,4.85,3.35,-4.52,brass);
for(const y of [1.55,3.1,4.45])beam(2.55,.11,.15,3.65,y,-4.51,brass);
beam(.12,3.65,.17,3.65,3.35,-4.5,brass);
const moonlight=new THREE.SpotLight(0x9aabd9,110,18,Math.PI/5,.65);moonlight.position.set(3.65,4.7,-3.5);moonlight.target.position.set(-1,0,2);room.add(moonlight,moonlight.target);
for(const x of [-6.5,-4.5,-2.5,-.5,1.5,3.5,5.5])beam(.045,.025,11,x,.025,.5,brass);
const rug=new THREE.Mesh(new THREE.PlaneGeometry(5.5,3.8),velvet);rug.rotation.x=-Math.PI/2;rug.position.set(-1,.038,2.2);rug.receiveShadow=true;room.add(rug);
for(const z of [.35,4.05])beam(5.6,.025,.04,-1,.045,z,brass);
const warm=new THREE.PointLight(0xffaa72,42,12);warm.position.set(-3.5,3.1,1);scene.add(warm);
camera.position.set(6.4,3.6,8.8);orbit.target.set(-.2,1.3,-.5);orbit.update();

const loader=new GLTFLoader();let success=0,fail=0;
const objects=[{name:'Готическая кровать',path:'https://raw.githubusercontent.com/nalabogarne-create/Ravencraft/imvu-quality-rebuild/assets/real/gothic-bed.glb',x:-2,z:0,height:2.8},{name:'Готический шкаф',path:'https://raw.githubusercontent.com/nalabogarne-create/Ravencraft/imvu-quality-rebuild/assets/real/gothic-cabinet.glb',x:2.4,z:-1,height:2.4}];
function report(){status.textContent='Готическая спальня: '+success+' из 2 моделей загружено'+(fail?' · '+fail+' не загрузились. Проверь загрузку и доступность GLB-файлов.':'')}
for(const obj of objects){loader.load(obj.path,gltf=>{const root=gltf.scene,bounds=new THREE.Box3().setFromObject(root),size=bounds.getSize(new THREE.Vector3());if(size.y<=0)throw Error('empty model');root.scale.setScalar(obj.height/size.y);root.updateMatrixWorld(true);const fitted=new THREE.Box3().setFromObject(root),center=fitted.getCenter(new THREE.Vector3());root.position.set(obj.x-center.x,-fitted.min.y,obj.z-center.z);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});scene.add(root);success++;report()},undefined,e=>{console.error(obj.name,e);fail++;report()})}
document.querySelector('#turn').onclick=()=>{camera.position.set(-camera.position.z,4,camera.position.x);orbit.update()};
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
renderer.setAnimationLoop(()=>{orbit.update();renderer.render(scene,camera)});report();
</script></body></html>
