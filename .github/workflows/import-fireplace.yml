name: Import real 3D fireplace
on:
  push:
    paths:
      - '.github/workflows/import-fireplace.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download CC0 Poly Haven masonry fireplace and convert to embedded GLB
        run: |
          python3 - <<'PY'
          import requests,zipfile,io,os
          asset='scandinavian_masonry_heater'
          data=requests.get('https://api.polyhaven.com/files/'+asset,timeout=40)
          data.raise_for_status()
          j=data.json()
          print('Available formats:',list(j))
          import urllib.parse
          root=j.get('gltf',{})
          print('glTF keys',list(root))
          variant=root.get('1k') or root.get('2k') or next(iter(root.values()))
          print('variant',str(variant)[:1200])
          def walk(node):
              if isinstance(node,dict):
                  if isinstance(node.get('url'),str):yield node['url']
                  for v in node.values():yield from walk(v)
              elif isinstance(node,list):
                  for v in node:yield from walk(v)
          urls=list(dict.fromkeys(walk(variant)))
          if not urls:raise RuntimeError('No model urls found')
          os.makedirs('tmp-fireplace/textures',exist_ok=True)
          for url in urls:
              fn=os.path.basename(urllib.parse.urlparse(url).path)
              if not fn:continue
              destination='tmp-fireplace/'+('textures/' if fn.lower().endswith(('.jpg','.png','.exr')) else '')+fn
              print('Download',fn)
              r=requests.get(url,timeout=120);r.raise_for_status()
              open(destination,'wb').write(r.content)
          import glob
          files=glob.glob('tmp-fireplace/**/*.gltf',recursive=True)
          assert files,'No glTF found'
          open('/tmp/fireplace-path','w').write(files[0])
          PY
          npm install --no-save @gltf-transform/cli@4
          mkdir -p assets/real
          npx gltf-transform copy "$(cat /tmp/fireplace-path)" assets/real/fireplace.glb
          test -s assets/real/fireplace.glb
      - name: Commit actual downloaded fireplace GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/real/fireplace.glb
          git diff --cached --quiet || (git commit -m "Import Poly Haven CC0 real fireplace model" && git push origin main)
