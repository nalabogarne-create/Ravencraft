name: Import real 3D fireplace
on:
  push:
    paths:
      - '.github/workflows/import-fireplace.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download CC0 Poly Haven masonry fireplace and convert to embedded GLB
        run: |
          python3 - <<'PY'
          import requests,zipfile,io,os
          asset='scandinavian_masonry_heater'
          data=requests.get('https://api.polyhaven.com/files/'+asset,timeout=40)
          data.raise_for_status()
          j=data.json()
          print('Available formats:',list(j))
          def find_zip(node):
              if isinstance(node,dict):
                  for k,v in node.items():
                      if k.lower() in ('url','download_url') and isinstance(v,str) and ('.zip' in v.lower() or 'gltf' in v.lower()):return v
                  for k,v in node.items():
                      if 'gltf' in k.lower():
                          z=find_zip(v)
                          if z:return z
                  for v in node.values():
                      z=find_zip(v)
                      if z:return z
              return None
          url=find_zip(j.get('gltf',j))
          if not url:raise RuntimeError('No glTF download URL in Poly Haven API')
          print('Downloading',url)
          r=requests.get(url,timeout=180);r.raise_for_status()
          os.makedirs('tmp-fireplace',exist_ok=True)
          if r.content[:2]==b'PK':
              with zipfile.ZipFile(io.BytesIO(r.content)) as z:z.extractall('tmp-fireplace')
          else:
              open('tmp-fireplace/model.gltf','wb').write(r.content)
          for root,dirs,files in os.walk('tmp-fireplace'):
              for file in files:
                  if file.endswith('.gltf'):open('/tmp/fireplace-path','w').write(os.path.join(root,file));break
          assert os.path.exists('/tmp/fireplace-path'),'No glTF found'
          PY
          npm install --no-save @gltf-transform/cli@4
          mkdir -p assets/real
          npx gltf-transform copy "$(cat /tmp/fireplace-path)" assets/real/fireplace.glb
          test -s assets/real/fireplace.glb
      - name: Commit actual downloaded fireplace GLB
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/real/fireplace.glb
          git diff --cached --quiet || (git commit -m "Import Poly Haven CC0 real fireplace model" && git push origin main)
