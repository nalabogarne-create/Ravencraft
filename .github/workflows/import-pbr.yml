name: Import real CC0 PBR castle textures
on:
  push:
    branches: [main]
    paths: ['rebuild/import-pbr.py', '.github/workflows/import-pbr.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  textures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download real 1K PBR texture maps from Poly Haven
        run: python rebuild/import-pbr.py
      - name: Commit maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pbr/
          git diff --cached --quiet || (git commit -m "Add CC0 PBR castle materials" && git push)
